<!DOCTYPE html><html class="light" lang="en"><head>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        body { font-family: 'Sora', sans-serif; }
        
        .voice-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid theme('colors.secondary-fixed');
            opacity: 0;
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .voice-ring:nth-child(2) {
            animation-delay: 0.5s;
        }

        .voice-ring:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes pulse-ring {
            0% {
                width: 120px;
                height: 120px;
                opacity: 0.8;
                border-width: 8px;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
                border-width: 1px;
            }
        }

        .gradient-text {
            background: linear-gradient(90deg, theme('colors.primary'), theme('colors.secondary'));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-surface text-on-surface w-full h-screen overflow-hidden flex flex-col relative select-none">
<!-- Top Progress Bar -->
<div class="fixed top-0 left-0 w-full h-[12px] bg-surface-container-high z-[60]">
<div class="h-full bg-primary w-1/3 transition-all duration-500 rounded-r-full"></div>
</div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-edge h-[120px] bg-surface dark:bg-surface border-b-2 border-outline-variant mt-[12px]">
<div class="flex items-center gap-4">
<span class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed">OPD Kiosk</span>
</div>
<div class="flex items-center gap-stack-gap">
<button class="flex items-center justify-center min-w-[80px] min-h-[80px] rounded-full hover:bg-surface-variant dark:hover:bg-surface-variant text-primary dark:text-primary-fixed transition-colors">
<span class="material-symbols-outlined text-[40px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
</button>
<button class="flex items-center justify-center min-w-[80px] min-h-[80px] rounded-full hover:bg-surface-variant dark:hover:bg-surface-variant text-primary dark:text-primary-fixed transition-colors">
<span class="material-symbols-outlined text-[40px]">translate</span>
</button>
<button class="bg-error text-on-error h-touch-target-min px-8 rounded-full font-button-text text-button-text flex items-center gap-3 ml-gutter shadow-sm active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[32px]">emergency</span>
                SOS / Call Staff
            </button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 px-margin-edge pb-[160px] flex flex-col items-center justify-center w-full max-w-[1920px] mx-auto overflow-hidden relative z-10 py-2">
<!-- Ambient Background Element -->
<div class="fixed inset-0 z-[-1] opacity-30 pointer-events-none" style="background: radial-gradient(circle at 50% 40%, theme('colors.secondary-fixed-dim') 0%, transparent 60%);"></div>
<!-- Conversational Area -->
<div class="w-full max-w-5xl flex flex-col items-center z-10 gap-stack-gap">
<!-- System Prompt -->
<div class="w-full flex flex-col items-center gap-3 bg-surface-container-low p-4 rounded-3xl border-2 border-outline-variant shadow-sm">
<div class="flex items-center justify-between w-full px-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[28px] text-primary">record_voice_over</span>
<span class="font-label-lg text-label-lg text-on-surface font-semibold">Who is speaking / providing information?</span>
</div>
<div class="flex items-center gap-2 bg-secondary-container text-on-secondary-container px-4 py-1.5 rounded-full border border-secondary">
<span class="material-symbols-outlined text-[22px]">verified_user</span>
<span class="font-label-lg text-body-md font-bold">Active Record: Patient (Primary Complaints)</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4 w-full">
<button class="flex items-center justify-center gap-4 py-3 px-6 rounded-2xl bg-primary text-on-primary shadow-md border-2 border-primary transition-all" type="button">
<span class="material-symbols-outlined text-[36px]">person</span>
<div class="text-left">
<div class="font-headline-md text-[24px] font-bold leading-tight">Patient (Self)</div>
<div class="text-body-md text-[18px] opacity-90">Self-reported symptoms &amp; feelings</div>
</div>
<span class="material-symbols-outlined text-[28px] ml-auto">check_circle</span>
</button>
<button class="flex items-center justify-center gap-4 py-3 px-6 rounded-2xl bg-surface-container-lowest text-on-surface border-2 border-outline-variant hover:bg-surface-variant transition-all" type="button">
<span class="material-symbols-outlined text-[36px] text-secondary">diversity_1</span>
<div class="text-left">
<div class="font-headline-md text-[24px] font-bold leading-tight">Informant / Attendant</div>
<div class="text-body-md text-[18px] text-on-surface-variant">Family member, caregiver observation</div>
</div>
</button>
</div>
</div><div class="bg-surface-container-lowest rounded-3xl border-2 border-[#D1E4F5] w-full text-center relative shadow-sm px-8">
<div class="absolute -top-6 left-1/2 -translate-x-1/2 bg-surface-variant text-on-surface-variant px-6 py-2 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-[24px]">volume_up</span>
<span class="font-label-lg text-label-lg">Doctor Assistant</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mt-4">"What brings you to the hospital today?"</h1>
</div>
<!-- Voice Interaction Zone -->
<div class="relative flex flex-col items-center justify-center w-full py-8">
<!-- Ripples -->
<div class="absolute w-[300px] h-[300px] flex items-center justify-center pointer-events-none">
<div class="voice-ring"></div>
<div class="voice-ring"></div>
<div class="voice-ring"></div>
</div>
<!-- Mic Button -->
<button class="relative z-10 w-[160px] h-[160px] bg-secondary text-on-secondary rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[80px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<p class="mt-8 font-headline-md text-headline-md text-tertiary-container text-center animate-pulse">Listening... Speak clearly</p>
</div>
</div>
<!-- Primary Action -->
<button class="absolute bottom-[40px] right-margin-edge bg-primary text-on-primary h-[100px] px-12 rounded-full font-button-text text-button-text flex items-center justify-center gap-4 shadow-md active:scale-95 transition-transform z-20">
            Finish Interview
            <span class="material-symbols-outlined text-[40px]">arrow_forward</span>
</button>
<button class="absolute bottom-[160px] left-1/2 -translate-x-1/2 bg-surface-container-high text-on-surface-variant h-[100px] px-12 rounded-full font-button-text text-button-text flex items-center justify-center gap-4 shadow-sm border-2 border-outline-variant active:scale-95 transition-transform z-20">
<span class="material-symbols-outlined text-[40px]">keyboard</span>
            Type instead
        </button></main>
<!-- Footer -->
<footer class="fixed bottom-0 w-full z-50 flex justify-between items-center px-margin-edge h-[100px] shadow-2xl bg-secondary-container dark:bg-secondary-container rounded-t-xl text-on-secondary-container dark:text-on-secondary-container font-body-lg text-body-lg">
<div class="flex items-center gap-6">
<span class="material-symbols-outlined text-[32px]">security</span>
<span>Your data is private. This session will clear automatically.</span>
</div>
<div class="flex items-center gap-stack-gap">
<button class="font-label-lg text-label-lg font-semibold hover:opacity-100 opacity-80 transition-opacity min-h-touch-target-min px-6 rounded-full">
                Accessibility Settings
            </button>
<button class="font-label-lg text-label-lg font-semibold hover:opacity-100 opacity-80 transition-opacity min-h-touch-target-min px-6 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined">language</span>
                Language
            </button>
</div>
</footer>
</body></html>
