<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>OPD Kiosk - Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "inverse-on-surface": "#f0f0f3",
                      "error-container": "#ffdad6",
                      "on-tertiary": "#ffffff",
                      "on-primary": "#ffffff",
                      "surface-bright": "#f9f9fc",
                      "on-tertiary-fixed-variant": "#40484e",
                      "surface-container-lowest": "#ffffff",
                      "on-error-container": "#93000a",
                      "secondary-fixed": "#8cf3f3",
                      "tertiary-fixed": "#dce3eb",
                      "surface-tint": "#004dea",
                      "tertiary-container": "#616970",
                      "on-primary-container": "#e3e6ff",
                      "outline-variant": "#c3c5d9",
                      "secondary": "#006a6a",
                      "primary-fixed-dim": "#b6c4ff",
                      "background": "#f9f9fc",
                      "on-primary-fixed": "#001551",
                      "on-tertiary-container": "#e2e9f0",
                      "on-error": "#ffffff",
                      "primary-container": "#0055ff",
                      "on-surface": "#1a1c1e",
                      "primary-fixed": "#dce1ff",
                      "outline": "#737688",
                      "inverse-primary": "#b6c4ff",
                      "error": "#ba1a1a",
                      "inverse-surface": "#2f3133",
                      "on-secondary": "#ffffff",
                      "on-secondary-container": "#007070",
                      "tertiary": "#495157",
                      "surface-variant": "#e2e2e5",
                      "surface-container-highest": "#e2e2e5",
                      "surface": "#f9f9fc",
                      "secondary-container": "#8cf3f3",
                      "on-primary-fixed-variant": "#0039b3",
                      "tertiary-fixed-dim": "#c0c7cf",
                      "surface-container-high": "#e8e8ea",
                      "on-secondary-fixed": "#002020",
                      "on-surface-variant": "#434656",
                      "surface-container-low": "#f3f3f6",
                      "on-background": "#1a1c1e",
                      "surface-container": "#eeeef0",
                      "secondary-fixed-dim": "#6fd7d6",
                      "on-secondary-fixed-variant": "#004f4f",
                      "on-tertiary-fixed": "#151c22",
                      "primary": "#0041c8",
                      "surface-dim": "#dadadc"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "32px",
                      "stack-gap": "24px",
                      "section-gap": "80px",
                      "touch-target-min": "80px",
                      "margin-edge": "64px"
              },
              "fontFamily": {
                      "label-lg": ["Sora"],
                      "button-text": ["Sora"],
                      "headline-md": ["Sora"],
                      "display-lg": ["Sora"],
                      "body-lg": ["Sora"],
                      "body-md": ["Sora"],
                      "headline-lg": ["Sora"]
              },
              "fontSize": {
                      "label-lg": ["24px", {"lineHeight": "30px", "fontWeight": "600"}],
                      "button-text": ["28px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "headline-md": ["36px", {"lineHeight": "44px", "fontWeight": "600"}],
                      "display-lg": ["72px", {"lineHeight": "88px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["28px", {"lineHeight": "40px", "fontWeight": "400"}],
                      "body-md": ["22px", {"lineHeight": "32px", "fontWeight": "400"}],
                      "headline-lg": ["48px", {"lineHeight": "60px", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        body { font-family: 'Sora', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col relative select-none">
<!-- Progress Bar -->
<div class="fixed top-0 left-0 w-full h-[12px] bg-surface-variant z-[60]">
<div class="h-full bg-primary w-1/4 rounded-r-full transition-all duration-500 ease-in-out"></div>
</div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-edge h-[120px] bg-surface border-b-2 border-outline-variant mt-[12px]">
<div class="flex items-center gap-4">
<span class="text-headline-md font-headline-md font-bold text-primary">OPD Kiosk</span>
</div>
<div class="flex items-center gap-6">
<button class="min-w-[touch-target-min] min-h-[touch-target-min] flex flex-col items-center justify-center gap-2 text-on-surface-variant hover:bg-surface-variant rounded-xl transition-transform duration-150 active:scale-95 px-6">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="text-label-lg font-label-lg">Home</span>
</button>
<button class="min-w-[touch-target-min] min-h-[touch-target-min] flex flex-col items-center justify-center gap-2 text-on-surface-variant hover:bg-surface-variant rounded-xl transition-transform duration-150 active:scale-95 px-6">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 0;">translate</span>
<span class="text-label-lg font-label-lg">Translate</span>
</button>
<button class="min-h-[touch-target-min] flex items-center justify-center gap-4 bg-error text-on-error rounded-full px-8 ml-4 transition-transform duration-150 active:scale-95 shadow-md">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">emergency</span>
<span class="text-button-text font-button-text">SOS / Call Staff</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 mt-[132px] mb-[100px] px-margin-edge py-section-gap flex flex-col items-center justify-center relative bg-[#E8F1F9]">
<!-- Background Ambient Design (Tonal Layers) -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute top-10 left-10 w-96 h-96 bg-primary-container rounded-full mix-blend-multiply filter blur-[100px]"></div>
<div class="absolute bottom-10 right-10 w-96 h-96 bg-secondary-container rounded-full mix-blend-multiply filter blur-[100px]"></div>
</div>
<div class="z-10 w-full max-w-[1400px] flex flex-col items-center gap-16">
<!-- Greeting -->
<div class="text-center">
<h1 class="text-display-lg font-display-lg text-on-surface mb-4">Welcome, Aarav</h1>
<p class="text-headline-md font-headline-md text-on-surface-variant">Please select an option to begin</p>
</div>
<!-- Bento Grid Options -->
<div class="grid grid-cols-3 gap-8 w-full">
<!-- Option 1: AI Assistant (Featured) -->
<button class="col-span-1 min-h-[400px] bg-surface rounded-[32px] border-2 border-[#D1E4F5] p-10 flex flex-col items-center justify-center gap-8 transition-all duration-300 hover:border-primary hover:shadow-[0_8px_30px_rgb(0,65,200,0.12)] active:border-[4px] group">
<div class="w-32 h-32 rounded-full bg-primary-fixed flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'FILL' 0;">mic</span>
</div>
<div class="text-center">
<h2 class="text-headline-lg font-headline-lg text-on-surface mb-2">Talk to AI Assistant</h2>
<p class="text-body-lg font-body-lg text-on-surface-variant">Describe your symptoms vocally</p>
</div>
</button>
<!-- Option 2: Scan Documents -->
<button class="col-span-1 min-h-[400px] bg-surface rounded-[32px] border-2 border-[#D1E4F5] p-10 flex flex-col items-center justify-center gap-8 transition-all duration-300 hover:border-primary hover:shadow-[0_8px_30px_rgb(0,65,200,0.12)] active:border-[4px] group">
<div class="w-32 h-32 rounded-full bg-secondary-fixed flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-[64px] text-secondary" style="font-variation-settings: 'FILL' 0;">document_scanner</span>
</div>
<div class="text-center">
<h2 class="text-headline-lg font-headline-lg text-on-surface mb-2">Scan Documents</h2>
<p class="text-body-lg font-body-lg text-on-surface-variant">Upload past reports or IDs</p>
</div>
</button>
<!-- Option 3: Review History -->
<button class="col-span-1 min-h-[400px] bg-surface rounded-[32px] border-2 border-[#D1E4F5] p-10 flex flex-col items-center justify-center gap-8 transition-all duration-300 hover:border-primary hover:shadow-[0_8px_30px_rgb(0,65,200,0.12)] active:border-[4px] group">
<div class="w-32 h-32 rounded-full bg-tertiary-fixed flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-[64px] text-tertiary" style="font-variation-settings: 'FILL' 0;">history</span>
</div>
<div class="text-center">
<h2 class="text-headline-lg font-headline-lg text-on-surface mb-2">Review My History</h2>
<p class="text-body-lg font-body-lg text-on-surface-variant">View past visits and prescriptions</p>
</div>
</button>
</div>
<!-- Voice State Indicator (Idle) -->
<div class="mt-8 flex items-center justify-center">
<div class="relative w-24 h-24 flex items-center justify-center rounded-full bg-secondary-fixed">
<div class="absolute inset-0 rounded-full bg-secondary-fixed animate-ping opacity-20"></div>
<span class="material-symbols-outlined text-[40px] text-secondary">graphic_eq</span>
</div>
</div>
</div>
</main>
<!-- Footer / Privacy Toast -->
<footer class="fixed bottom-0 w-full z-50 flex justify-between items-center px-margin-edge h-[100px] bg-secondary-container text-on-secondary-container rounded-t-xl shadow-2xl">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">privacy_tip</span>
<span class="text-label-lg font-label-lg font-semibold">Your data is private. This session will clear automatically.</span>
</div>
<div class="flex items-center gap-8">
<button class="text-body-lg font-body-lg opacity-80 hover:opacity-100 transition-opacity min-h-[touch-target-min] flex items-center">
                Accessibility Settings
            </button>
<button class="text-body-lg font-body-lg opacity-80 hover:opacity-100 transition-opacity min-h-[touch-target-min] flex items-center">
                Language
            </button>
</div>
</footer>
</body></html>
