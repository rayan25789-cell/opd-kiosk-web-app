<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        
        /* High visibility progress bar */
        .progress-bar-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background-color: #f3f3f6; /* surface-container-low */
            z-index: 100;
        }
        .progress-fill {
            height: 100%;
            width: 45%; /* Example progress */
            background-color: #0041c8; /* primary */
        }
        
        /* Custom keyboard styling */
        .key {
            min-height: 80px;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            border: 2px solid #c3c5d9; /* outline-variant */
            border-radius: 0.5rem;
            color: #1a1c1e; /* on-surface */
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .key:active {
            background-color: #e2e2e5; /* surface-variant */
            border-color: #0041c8; /* primary */
        }
        .key-wide {
            flex-grow: 1;
        }
        .key-space {
            flex-grow: 5;
        }
        .key-action {
            background-color: #e8e8ea; /* surface-container-high */
            color: #1a1c1e;
        }
        .key-primary {
            background-color: #0041c8;
            color: #ffffff;
            border: none;
        }
    </style>
</head>
<body class="bg-surface font-body-lg text-on-surface h-screen w-screen overflow-hidden flex flex-col pt-[132px] pb-[100px]">
<div class="progress-bar-top">
<div class="progress-fill"></div>
</div>
<!-- TopAppBar from Shared Components -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-edge h-[120px] bg-surface dark:bg-surface border-b-2 border-outline-variant mt-[12px]">
<div class="flex items-center gap-4">
<span class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed">OPD Kiosk</span>
</div>
<div class="flex items-center gap-6">
<button class="w-[80px] h-[80px] rounded-full flex items-center justify-center hover:bg-surface-variant dark:hover:bg-surface-variant text-on-surface-variant dark:text-on-surface-variant transition-transform duration-150 active:scale-95">
<span class="material-symbols-outlined text-[40px]" data-icon="home">home</span>
</button>
<button class="w-[80px] h-[80px] rounded-full flex items-center justify-center hover:bg-surface-variant dark:hover:bg-surface-variant text-on-surface-variant dark:text-on-surface-variant transition-transform duration-150 active:scale-95">
<span class="material-symbols-outlined text-[40px]" data-icon="translate">translate</span>
</button>
<button class="min-w-[80px] h-[80px] px-8 rounded-full flex items-center justify-center bg-error text-on-error font-button-text text-button-text hover:opacity-90 active:scale-95 transition-transform">
                SOS / Call Staff
            </button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col justify-between px-margin-edge py-2 max-w-7xl mx-auto w-full"><div class="flex flex-col gap-3 mb-2"><div class="flex items-center justify-between gap-4"><h1 class="text-headline-md font-headline-md text-on-surface">Please describe your symptoms</h1><div class="flex items-center gap-3"><span class="text-label-lg font-label-lg text-on-surface-variant font-semibold">Who is entering information?</span><div class="flex bg-surface-container-high p-1 rounded-xl border border-outline-variant gap-1"><button class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-label-lg text-label-lg transition-colors bg-primary text-on-primary shadow-sm font-semibold" type="button"><span class="material-symbols-outlined text-[28px]">person</span><span>Patient (Self)</span></button><button class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-label-lg text-label-lg transition-colors text-on-surface-variant hover:bg-surface-variant font-semibold" type="button"><span class="material-symbols-outlined text-[28px]">supervisor_account</span><span>Informant / Attendant</span></button></div></div></div><div class="relative w-full"><div class="flex items-center justify-between px-4 py-2 bg-primary-fixed text-on-primary-fixed rounded-t-xl border-t-2 border-x-2 border-primary text-label-lg font-semibold"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-[24px] text-primary">account_circle</span><span>Recording notes from: <strong class="text-primary">Patient (Direct)</strong> — kept separate from attendant statements</span></div><span class="material-symbols-outlined text-primary text-[20px]">verified_user</span></div><textarea autofocus="" class="w-full bg-surface-container-lowest border-2 border-primary rounded-b-xl rounded-t-none p-4 pb-16 text-headline-md font-headline-md text-on-surface placeholder-outline resize-none shadow-[0_0_15px_rgba(0,65,200,0.1)] outline-none focus:ring-4 focus:ring-primary/20 h-[120px]" placeholder="Tell us more about your symptoms...">I've been experiencing a mild headache</textarea><div class="absolute bottom-3 right-4 flex gap-4"><button class="h-[60px] px-6 rounded-full flex items-center gap-3 bg-surface-container-high hover:bg-surface-variant border-2 border-outline-variant text-on-surface font-button-text text-button-text transition-colors"><span class="material-symbols-outlined text-[28px]">mic</span><span>Speak instead</span></button></div></div></div><div class="w-full bg-surface-container-low rounded-xl p-3 shadow-sm border border-outline-variant flex flex-col gap-2 mb-2"><div class="flex gap-2 justify-center"><button class="key font-button-text text-button-text">Q</button><button class="key font-button-text text-button-text">W</button><button class="key font-button-text text-button-text">E</button><button class="key font-button-text text-button-text">R</button><button class="key font-button-text text-button-text">T</button><button class="key font-button-text text-button-text">Y</button><button class="key font-button-text text-button-text">U</button><button class="key font-button-text text-button-text">I</button><button class="key font-button-text text-button-text">O</button><button class="key font-button-text text-button-text">P</button><button class="key key-action font-button-text text-button-text px-4 w-[120px]"><span class="material-symbols-outlined text-[32px]">backspace</span></button></div><div class="flex gap-2 justify-center px-[40px]"><button class="key font-button-text text-button-text">A</button><button class="key font-button-text text-button-text">S</button><button class="key font-button-text text-button-text">D</button><button class="key font-button-text text-button-text">F</button><button class="key font-button-text text-button-text">G</button><button class="key font-button-text text-button-text">H</button><button class="key font-button-text text-button-text">J</button><button class="key font-button-text text-button-text">K</button><button class="key font-button-text text-button-text">L</button><button class="key key-action font-button-text text-button-text px-4 w-[120px]">Enter</button></div><div class="flex gap-2 justify-center"><button class="key key-action font-button-text text-button-text px-4 w-[120px]">Shift</button><button class="key font-button-text text-button-text">Z</button><button class="key font-button-text text-button-text">X</button><button class="key font-button-text text-button-text">C</button><button class="key font-button-text text-button-text">V</button><button class="key font-button-text text-button-text">B</button><button class="key font-button-text text-button-text">N</button><button class="key font-button-text text-button-text">M</button><button class="key font-button-text text-button-text">,</button><button class="key font-button-text text-button-text">.</button><button class="key key-action font-button-text text-button-text px-4 w-[120px]">Shift</button></div><div class="flex gap-2 justify-center"><button class="key key-action font-button-text text-button-text px-4 w-[120px]">?123</button><button class="key font-button-text text-button-text w-[80px]">@</button><button class="key key-space font-button-text text-button-text">Space</button><button class="key font-button-text text-button-text w-[80px]">-</button><button class="key key-primary font-button-text text-button-text px-8 min-w-[200px] flex gap-2">Next<span class="material-symbols-outlined text-[32px]">arrow_forward</span></button></div></div></main>

</body></html>
